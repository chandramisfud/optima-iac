# Flyway Configuration File for Optima Database

#==============================================================================
# Database Connection Settings
#==============================================================================
flyway.createSchemas=true
# JDBC URL for SQL Server
# Format: jdbc:sqlserver://host:port;databaseName=YourDatabase
flyway.url=jdbc:sqlserver://13.212.84.7:8080;databaseName=optimaiac;encrypt=true;trustServerCertificate=true

# Database credentials (use env vars in prod)
flyway.user=sa
flyway.password=A#nd007.

#==============================================================================
# Migration Locations
#==============================================================================

# Flyway will scan this location recursively for migration scripts
flyway.locations=filesystem:sql

#==============================================================================
# Migration Naming Patterns
#==============================================================================

# Prefix for versioned migrations (default: V)
flyway.sqlMigrationPrefix=V

# Separator between version and description (default: __)
flyway.sqlMigrationSeparator=__

# File suffixes to scan for (default: .sql)
flyway.sqlMigrationSuffixes=.sql

#==============================================================================
# Baseline Settings (For Existing Databases)
#==============================================================================

# Baseline on migrate - useful if database already has objects
# Set to true if you're applying Flyway to an existing database
flyway.baselineOnMigrate=true

# Version to tag existing schema with (default: 1)
flyway.baselineVersion=1

# Description for baseline version
flyway.baselineDescription=Initial baseline

#==============================================================================
# Schema Settings
#==============================================================================

# Default schema for Flyway metadata table and migrations
# Common SQL Server schemas: dbo, guest
flyway.schemas=dbo

# Create schemas if they don't exist
flyway.createSchemas=true

#==============================================================================
# Validation Settings
#==============================================================================

# Validate migrations before running migrate
flyway.validateOnMigrate=true

# Allow mixing transactional and non-transactional migrations
flyway.mixed=false

# Clean database before migration (DANGEROUS - use only in development)
flyway.cleanDisabled=true

#==============================================================================
# Execution Settings
#==============================================================================

# Encoding of SQL migration files
flyway.encoding=UTF-8

# Auto-detect encoding if UTF-8 fails
flyway.detectEncoding=true

# Fail fast on invalid migration names
flyway.validateMigrationNaming=true

# Enforce migration sequence (no out-of-order)
flyway.outOfOrder=false

# Placeholders for SQL scripts (optional)
# flyway.placeholders.environment=production
# flyway.placeholders.schema=dbo

# Enable placeholder replacement
flyway.placeholderReplacement=true

# Stream large migration files
flyway.stream=true

#==============================================================================
# Flyway Table Settings
#==============================================================================

# Name of Flyway's schema history table (default: flyway_schema_history)
flyway.table=flyway_schema_history

#==============================================================================
# Output Settings
#==============================================================================

# Whether to output a table with migration results
flyway.outputType=console

#==============================================================================
# SQL Server Specific Settings
#==============================================================================

# Lock retry count for SQL Server (handles deadlocks)
flyway.lockRetryCount=50

# Batch execution - set to false if you have GO statements
flyway.batch=false

# SQL Server statement delimiter (default: ;)
# Note: If your scripts use GO, you may need to handle this differently
# Split GO batches into separate files or replace with / for Flyway compatibility
# flyway.sqlMigrationSeparator=GO